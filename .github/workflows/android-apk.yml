name: Android APK

# 云端构建安卓客户端：把代码推到 GitHub 后，在 Actions 页手动触发
# （workflow_dispatch），或改动安卓相关文件自动触发；构建完成后在
# 该次运行的 Artifacts 里下载 MediaPlayer-android-apk。
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "core/**"
      - "ui/video_view.py"
      - "qtcompat.py"
      - "main_android.py"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    # 固定 24.04：ubuntu-latest(26.x) 的 libtool 2.5 删除了 LT_SYS_SYMBOL_USCORE，
    # p4a 里 libffi 的旧 autotools 文件引用该宏，autoreconf 会失败
    runs-on: ubuntu-24.04
    # 双架构：aarch64 给真机；x86_64 给模拟器原生运行
    # （x86_64 模拟器跑 arm64 包靠 Berberis 转译，PySide6/Python 大型原生
    #  应用会在转译器里 SIGSEGV，必须用原生 x86_64 包）
    strategy:
      matrix:
        arch: [aarch64, x86_64]
        fail-fast: false
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 准备 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 缓存安卓工具链（SDK/NDK/轮子，约 5GB）
        uses: actions/cache@v4
        with:
          path: ~/.cache/mediaplayer-android
          key: android-ubuntu-ndk28c-v2-${{ matrix.arch }}

      - name: 构建 APK
        run: |
          chmod +x android/build_linux.sh
          ARCH=${{ matrix.arch }} ./android/build_linux.sh

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayer-android-apk-${{ matrix.arch }}
          path: android/staging/*.apk
          if-no-files-found: error
